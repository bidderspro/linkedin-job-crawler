<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LinkedIn Job Scraper</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <h1>LinkedIn Job Scraper</h1>
        
        <div class="search-box">
            <input type="text" id="keyword" placeholder="Job title">
            <input type="text" id="location" placeholder="Location">
            <input type="number" id="jobCount" value="10" min="1">
            <select id="timeRange">
                <option value="all" selected>Any time</option>
                <option value="past_24h">Past 24 hours</option>
                <option value="past_week">Past week</option>
                <option value="past_month">Past month</option>
            </select>
            <button id="startScrape">Search Jobs</button>
        </div>

        <div class="status-bar" id="statusBar"></div>

        <div class="results">
            <div class="results-header">
                <h2>Saved Results</h2>
                <div class="results-count" id="resultsCount"></div>
            </div>
            <div class="file-list-container">
                <div class="file-list" id="fileList"></div>
            </div>
        </div>
    </div>
    
    <script>
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.message, e.filename, e.lineno);
        });
    </script>
    <script src="../renderer.js"></script>
</body>
</html>
